<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévisualisation en direct — Mamie &amp; le gâteau</title>
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="film/player.css">
  <style>
    html, body { margin: 0; min-height: 100%; background: #efe0c4; }
    body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 12px 24px; box-sizing: border-box; font-family: system-ui, sans-serif; color: #3a281f; }
    h1 { font-size: 18px; margin: 0; text-wrap: balance; text-align: center; }
    .gfp { max-width: min(480px, calc((100vh - 190px) * 9 / 16)); min-width: 260px; }
    p.note { font-size: 13px; max-width: 480px; text-align: center; margin: 0; opacity: .85; }
    body.capture { padding: 0; background: #000; }
    body.capture > :not(#player) { display: none; }
  </style>
</head>
<body>
  <h1>Mamie &amp; le gâteau — rendu en direct par JavaScript</h1>
  <div id="player"></div>
  <p class="note">Chaque image est dessinée à l’instant par <code>drawFrame()</code> sur un Canvas 2D (aucune vidéo). Espace&nbsp;: lecture/pause · ←/→&nbsp;: image par image.</p>
  <script src="film/core.js"></script>
  <script src="film/characters.js"></script>
  <script src="film/world.js"></script>
  <script src="film/story.js"></script>
  <script src="film/player.js"></script>
  <script>
    // ?capture=1 : mode export (Chromium headless) — pas de lecture auto, window.__anim prêt.
    const capture = new URLSearchParams(location.search).has('capture');
    if (capture) {
      document.body.classList.add('capture');
      const c = document.createElement('canvas'); document.getElementById('player').appendChild(c);
      GF.mount(c); window.__anim.drawFrame(0);
    } else {
      GFPlayer.create(document.getElementById('player'), { audio: 'soundtrack.m4a', autoplay: true });
    }
  </script>
</body>
</html>
